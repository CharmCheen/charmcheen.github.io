<!DOCTYPE html>
<html lang="zh" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>摄影随记 | Changhao Qin</title>
    <meta name="description" content="Changhao Qin 的摄影随记：记录街景、光线与不想忘记的瞬间。">
    <meta property="og:title" content="摄影随记 | Changhao Qin">
    <meta property="og:description" content="记录街景、光线与不想忘记的瞬间。">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://charmcheen.github.io/photography.html">
    <meta property="og:image" content="https://charmcheen.github.io/picture/og-image.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="摄影随记 | Changhao Qin">
    <meta name="twitter:description" content="记录街景、光线与不想忘记的瞬间。">
    <meta name="twitter:image" content="https://charmcheen.github.io/picture/og-image.jpg">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="canonical" href="https://charmcheen.github.io/photography.html">
    <link rel="preload" as="image" href="picture/photo-hero-1440.jpg"
        imagesrcset="picture/photographer/thumbs/1.jpg 800w, picture/photo-hero-1440.jpg 1440w"
        imagesizes="(max-width: 640px) 100vw, 1200px">
    <link rel="stylesheet" href="tailwind-static.css?v=20260625-6">
    <link rel="stylesheet" href="style.css?v=20260922-9">
</head>
<body class="bg-darkBg text-gray-100 font-sans min-h-screen p-4 md:p-8 lg:p-12 overflow-x-hidden selection:bg-white/20">
    <div id="page-transition-overlay" class="page-transition-overlay is-entering"></div>

    <!-- Subtle Background Glows -->
    <div class="fixed top-[-10%] left-[-10%] w-[40%] h-[40%] bg-blue-500/10 rounded-full blur-[120px] pointer-events-none mix-blend-screen animate-blob"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-gray-500/10 rounded-full blur-[120px] pointer-events-none mix-blend-screen animate-blob animation-delay-2000"></div>

    <main class="max-w-7xl mx-auto relative z-10 w-full h-full">
        
        <!-- Minimal Header -->
        <header class="mb-10 md:mb-12 flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4 opacity-0 page-entry-anim">
            <a href="index.html" aria-label="回到主页" class="self-start flex items-center gap-2 text-gray-400 hover:text-white transition-colors group cursor-pointer border border-transparent hover:border-white/10 px-4 py-2 rounded-full hover:bg-white/5 min-h-[44px] whitespace-nowrap">
                <svg class="w-4 h-4 group-hover:-translate-x-1 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M19 12H5"/>
                    <path d="m12 19-7-7 7-7"/>
                </svg>
                <span class="text-sm font-medium">回到主页</span>
            </a>
            <div class="w-full sm:w-auto text-center sm:text-right text-lg md:text-xl font-bold tracking-tighter leading-tight">
                Changhao Qin<span class="accent-dot">.</span><span class="text-gray-300">摄影随记</span>
            </div>
        </header>

        <!-- Gallery Header -->
        <section class="photo-hero mb-10 md:mb-14 opacity-0 page-entry-anim flex items-end">
            <img src="picture/photo-hero-1440.jpg"
                srcset="picture/photographer/thumbs/1.jpg 800w, picture/photo-hero-1440.jpg 1440w"
                sizes="(max-width: 640px) 100vw, 1200px"
                alt="树影间的红墙建筑"
                width="1440" height="960"
                fetchpriority="high">
            <div class="photo-hero-copy w-full p-6 md:p-10 lg:p-12">
                <p class="photo-hero-kicker text-xs md:text-sm font-semibold mb-4">Changhao Qin / 摄影随记</p>
                <h1 class="text-4xl md:text-6xl lg:text-7xl font-bold tracking-tight mb-5 select-none max-w-3xl">不想忘记的瞬间</h1>
                <p class="text-gray-300 max-w-2xl leading-relaxed text-base md:text-lg">
                    我没有固定拍摄主题。更多时候，只是在散步或旅行途中，遇见刚好的光线、天气，或人与城市之间短暂的关系。
                </p>
                <div class="mt-8 flex flex-wrap items-center gap-3 text-sm text-gray-300">
                    <span class="inline-flex items-center gap-2 accent-button px-4 py-2 rounded-full">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M12 3l1.7 5.2L19 10l-5.3 1.8L12 17l-1.7-5.2L5 10l5.3-1.8L12 3Z"/>
                            <path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8L19 15Z"/>
                        </svg>
                        光线、街景、松弛感
                    </span>
                    <span class="inline-flex items-center gap-2 text-gray-300">
                        <svg class="w-4 h-4 text-accent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="12" r="9"/>
                            <path d="M12 11v5"/>
                            <path d="M12 8h.01"/>
                        </svg>
                        点击照片查看细节
                    </span>
                </div>
            </div>
        </section>

        <!-- Masonry-style Grid Container designed for photos -->
        <div id="photography-gallery" class="grid gap-4 md:gap-6 w-full auto-rows-[250px]" style="grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));">
            <!-- Dynamic photos injected via JS from picture/photographer/ -->
        </div>
        
        <!-- Loading State Indicator (Hidden when images start loading or fail) -->
        <button id="gallery-loader" type="button" class="gallery-loader-button w-full flex flex-col items-center justify-center py-12 text-gray-500 gap-3 opacity-0 page-entry-anim">
            <span class="gallery-loader-icon is-spinning" aria-hidden="true"></span>
            <span class="text-sm" data-loader-label>正在整理照片...</span>
        </button>
        
        <!-- Footer -->
        <footer class="mt-16 text-center text-xs text-gray-500 opacity-0 page-entry-anim py-8 relative z-20 w-full mb-4">
            <p>&copy; <span id="year">2026</span> Changhao Qin</p>
            <p class="mt-2 text-gray-500">照片与文字，均由 Changhao Qin 整理。</p>
        </footer>
        
    </main>

    <!-- Supercharged Lightbox Modal for Slider & Zoom -->
    <div id="lightbox" class="fixed inset-0 z-50 bg-black/98 backdrop-blur-2xl hidden flex-col items-center justify-center opacity-0 transition-opacity duration-400" role="dialog" aria-modal="true" aria-labelledby="lightbox-title" aria-describedby="lightbox-help">
        <h2 id="lightbox-title" class="sr-only">摄影作品大图</h2>
        
        <!-- Top Control Bar -->
        <div class="absolute top-0 w-full p-4 md:p-6 flex justify-between items-center z-50 bg-gradient-to-b from-black/80 to-transparent">
            <div class="text-gray-400 font-medium text-sm tracking-wider" id="lightbox-counter">
                <span id="lightbox-current" class="text-white" aria-live="polite">1</span> / <span id="lightbox-total">--</span>
            </div>
            
            <div class="flex gap-4">
                <button id="lightbox-zoom" class="text-white/70 hover:text-white bg-white/5 hover:bg-white/20 rounded-full w-12 h-12 flex items-center justify-center backdrop-blur-md transition-all border border-white/10" title="放大或缩小" aria-label="放大或缩小">
                    <span id="zoom-icon" class="zoom-icon-stack" aria-hidden="true">
                        <svg class="zoom-in-icon w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="7"/>
                            <path d="M21 21l-4.3-4.3"/>
                            <path d="M11 8v6"/>
                            <path d="M8 11h6"/>
                        </svg>
                        <svg class="zoom-out-icon w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="7"/>
                            <path d="M21 21l-4.3-4.3"/>
                            <path d="M8 11h6"/>
                        </svg>
                    </span>
                </button>
                <button id="lightbox-close" class="text-white/70 hover:text-white bg-white/5 hover:bg-white/20 rounded-full w-12 h-12 flex items-center justify-center backdrop-blur-md transition-all border border-white/10" title="关闭（ESC）" aria-label="关闭大图">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M18 6 6 18"/>
                        <path d="m6 6 12 12"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Left Navigation Arrow -->
        <button id="lightbox-prev" class="absolute left-2 md:left-8 top-1/2 -translate-y-1/2 text-white/50 hover:text-white bg-black/40 hover:bg-white/10 rounded-full w-12 md:w-16 h-12 md:h-16 flex items-center justify-center backdrop-blur-md transition-all border border-white/5 z-50 group shadow-lg" aria-label="上一张">
            <svg class="w-7 h-7 group-hover:-translate-x-1 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m15 18-6-6 6-6"/>
            </svg>
        </button>

        <!-- Image Container -->
        <div class="relative w-full h-[100dvh] flex items-center justify-center overflow-hidden" id="lightbox-img-container">
            <!-- Using user-select-none and pointer-events adjustments for pure dragging/zooming mechanics -->
            <img id="lightbox-img" src="" alt="放大的摄影作品" class="max-w-[90vw] max-h-[85vh] object-contain rounded-md shadow-2xl scale-95 transition-transform duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] select-none cursor-zoom-in" draggable="false">
        </div>

        <!-- Right Navigation Arrow -->
        <button id="lightbox-next" class="absolute right-2 md:right-8 top-1/2 -translate-y-1/2 text-white/50 hover:text-white bg-black/40 hover:bg-white/10 rounded-full w-12 md:w-16 h-12 md:h-16 flex items-center justify-center backdrop-blur-md transition-all border border-white/5 z-50 group shadow-lg" aria-label="下一张">
            <svg class="w-7 h-7 group-hover:translate-x-1 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m9 18 6-6-6-6"/>
            </svg>
        </button>
        
        <!-- Bottom info bar -->
        <div id="lightbox-help" class="absolute bottom-6 w-full text-center z-50 pointer-events-none opacity-50 text-xs text-gray-400 hidden md:block">
            使用 <kbd class="px-1 border border-gray-500 rounded">←</kbd> <kbd class="px-1 border border-gray-500 rounded">→</kbd> 切换，<kbd class="px-1 border border-gray-500 rounded">ESC</kbd> 关闭，双击图片缩放。
        </div>
    </div>

    <!-- Separate JS for the distinct logic of the photography page -->
    <script src="photography.js?v=20260922-2"></script>
</body>
</html>
